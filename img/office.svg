  <rect x="148" y="6" width="9" height="1" fill="#1f3bff"/><rect x="148" y="8" width="14" height="1" fill="#1f3bff"/><rect x="160" y="6" width="6" height="1" fill="#d24c3a"/>

  <!-- work room -->
