  <text x="101" y="94.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="6.5" fill="#1f2a7a" shape-rendering="auto">tulifo<tspan dx="2" font-size="3.6" font-weight="500" dy="-0.4">AI Agent Team &amp; Company</tspan></text>
  <use href="#plant" x="188" y="84"/><use href="#plant" x="6" y="84"/>


  <!-- the office cat, asleep in the meeting room -->
  <g transform="translate(166 64)">
    <rect class="tail" x="-3" y="3" width="3" height="1" fill="#7a7a7a"/>
    <rect x="0" y="1" width="7" height="3" fill="#9a9a9a"/><rect x="2" y="1" width="1" height="3" fill="#7a7a7a"/><rect x="4" y="1" width="1" height="3" fill="#7a7a7a"/>
