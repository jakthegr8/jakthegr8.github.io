  <use href="#desk" x="10" y="44"/><use href="#desk" x="40" y="44"/><use href="#desk" x="92" y="44"/>
  <use href="#plant" x="114" y="13"/><use href="#plant" x="6" y="62"/>

  <!-- agent at desk 1: screen on, typing -->
  <rect x="15" y="19" width="6" height="4" fill="#2f63c9"/>
  <rect class="code" x="16" y="20" width="3" height="1" fill="#a9d6ff"/><rect class="code b" x="16" y="22" width="4" height="1" fill="#a9d6ff"/>
  <g>
    <use href="#back-head" x="14" y="26" fill="#2a1d14"/>
