  <!-- wall decor -->
  <rect x="58" y="5" width="5" height="5" fill="#f4f4f0"/><rect x="58" y="5" width="5" height="1" fill="#8a8a85"/><rect x="60" y="6" width="1" height="2" fill="#333"/><rect x="61" y="7" width="1" height="1" fill="#333"/>
  <rect x="20" y="5" width="14" height="5" fill="#9a7b56"/><rect x="21" y="6" width="12" height="3" fill="#7fb2a0"/>
  <rect x="88" y="5" width="14" height="5" fill="#9a7b56"/><rect x="89" y="6" width="12" height="3" fill="#d9b36c"/>
