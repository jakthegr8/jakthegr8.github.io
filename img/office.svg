    <g class="zz"><rect x="8" y="-3" width="2" height="1" fill="#474b68"/><rect x="9" y="-2" width="1" height="1" fill="#474b68"/><rect x="8" y="-1" width="2" height="1" fill="#474b68"/></g>
    <g class="zz b"><rect x="8" y="-3" width="2" height="1" fill="#474b68"/><rect x="9" y="-2" width="1" height="1" fill="#474b68"/><rect x="8" y="-1" width="2" height="1" fill="#474b68"/></g>
