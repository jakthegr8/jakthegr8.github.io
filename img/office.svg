  <rect x="67" y="4" width="2" height="3" fill="#c0392b"/><rect x="69" y="5" width="2" height="2" fill="#1f3bff"/><rect x="72" y="4" width="1" height="3" fill="#e09f3e"/><rect x="74" y="4" width="2" height="3" fill="#16a085"/><rect x="78" y="5" width="2" height="2" fill="#f7f7f3"/>
