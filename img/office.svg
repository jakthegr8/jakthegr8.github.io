    <rect class="arm-l" x="14" y="31" width="1" height="3" fill="#9e2e22"/>
    <rect class="arm-r" x="21" y="31" width="1" height="3" fill="#9e2e22"/>
  </g>
  <g class="done" transform="translate(23 19)">
    <use href="#bubble"/><rect x="5" y="2" width="1" height="1" fill="#2e9b4f"/><rect x="2" y="3" width="1" height="1" fill="#2e9b4f"/><rect x="3" y="4" width="1" height="1" fill="#2e9b4f"/><rect x="4" y="3" width="1" height="1" fill="#2e9b4f"/><rect x="6" y="1" width="1" height="1" fill="#2e9b4f"/>
  </g>

  <!-- agent at desk 6: screen on, typing, sometimes waits for an answer -->
