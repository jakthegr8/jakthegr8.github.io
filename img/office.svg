<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="800" height="400" shape-rendering="crispEdges">
  <title>Tulifo agent office</title>
  <desc>Pixel-art office: six agents type at their desks, one walks to the meeting room and back, three meet at the whiteboard and table, a dog patrols the hall and a cat sleeps. Drawn by hand, not live data.</desc>
  <style>
    .arm-l { animation: type .5s steps(1) infinite; }
    .arm-r { animation: type .5s steps(1) -.25s infinite; }
    @keyframes type { 50% { transform: translateY(-1px); } }
    .code { animation: code 2.4s steps(1) infinite; }
    .code.b { animation-delay: -1.2s; }
    @keyframes code { 25% { transform: translateX(1px); } 50% { transform: translateX(-1px); } 75% { transform: translateX(2px); } }
    .walker { animation: walk 16s linear infinite; }
    @keyframes walk {
      0% { transform: translate(74px, 32px); }
      10% { transform: translate(74px, 76px); }
      34% { transform: translate(156px, 76px); }
      42%, 62% { transform: translate(156px, 50px); }
      70% { transform: translate(156px, 76px); }
      92% { transform: translate(74px, 76px); }
      100% { transform: translate(74px, 32px); }
    }
    .legs-a { animation: step .36s steps(1) infinite; }
    .legs-b { animation: step .36s steps(1) -.18s infinite; }
    @keyframes step { 50% { opacity: 0; } }
    .moving { animation: moving 16s steps(1) infinite; }
    .still { animation: still 16s steps(1) infinite; }
    @keyframes moving { 42% { visibility: hidden; } 62% { visibility: visible; } }
    @keyframes still { 0% { visibility: hidden; } 42% { visibility: visible; } 62% { visibility: hidden; } }
    .talk { animation: talk 16s steps(1) infinite; }
    @keyframes talk { 0% { opacity: 0; } 44% { opacity: 1; } 50% { opacity: 0; } 53% { opacity: 1; } 60% { opacity: 0; } }
    .wait { animation: wait 6s steps(1) infinite; }
    @keyframes wait { 0% { opacity: 0; } 60% { opacity: 1; } }
    .done { animation: done 9s steps(1) -4s infinite; }
    @keyframes done { 0% { opacity: 0; } 80% { opacity: 1; } }
    .steam { animation: steam 1.6s steps(1) infinite; }
    @keyframes steam { 50% { transform: translate(1px, -1px); } }
    .dog { animation: dog 12s linear infinite; }
    @keyframes dog { 0%, 100% { transform: translate(14px, 79px); } 50% { transform: translate(60px, 79px); } }
    .dog-face { transform-box: fill-box; transform-origin: center; animation: face 12s steps(1) infinite; }
    @keyframes face { 50% { transform: scaleX(-1); } }
    .wag { animation: step .3s steps(1) infinite; }
    .tail { transform-box: fill-box; transform-origin: right; animation: swish 3s steps(1) infinite; }
    @keyframes swish { 70% { transform: translateY(-1px); } 85% { transform: translateY(-2px); } }
    .zz { animation: zz 3s linear infinite; }
    .zz.b { animation-delay: -1.5s; }
    @keyframes zz { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(2px, -6px); opacity: 0; } }
    .lamp { animation: lamp 4s steps(1) infinite; }
    @keyframes lamp { 90% { opacity: .6; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .walker { transform: translate(156px, 50px); }
      .moving { visibility: hidden; }
    }
  </style>
  <defs>
    <pattern id="tiles" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#efe6d2"/><rect width="4" height="4" fill="#f6efdf"/><rect x="4" y="4" width="4" height="4" fill="#f6efdf"/>
    </pattern>
    <pattern id="lilac" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ccd0f2"/><rect width="8" height="1" fill="#c2c6ea"/><rect width="1" height="8" fill="#c2c6ea"/>
    </pattern>
    <pattern id="hall" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#f7f7f3"/><rect width="6" height="1" fill="#e4e4de"/><rect width="1" height="6" fill="#e4e4de"/>
    </pattern>
    <g id="desk">
      <rect x="0" y="6" width="26" height="6" fill="#a8723f"/>
      <rect x="0" y="11" width="26" height="2" fill="#7d522a"/>
      <rect x="4" y="0" width="8" height="6" fill="#d9d9d2"/><rect x="5" y="1" width="6" height="4" fill="#2b2f4a"/><rect x="7" y="6" width="2" height="1" fill="#8a8a85"/>
      <rect x="15" y="0" width="8" height="6" fill="#d9d9d2"/><rect x="16" y="1" width="6" height="4" fill="#2b2f4a"/><rect x="18" y="6" width="2" height="1" fill="#8a8a85"/>
      <rect x="5" y="15" width="6" height="4" fill="#3f7f4a"/><rect x="5" y="18" width="6" height="1" fill="#2f5f38"/>
      <rect x="16" y="15" width="6" height="4" fill="#3f7f4a"/><rect x="16" y="18" width="6" height="1" fill="#2f5f38"/>
    </g>
    <g id="plant">
      <rect x="2" y="0" width="2" height="2" fill="#4c9a52"/><rect x="0" y="2" width="6" height="2" fill="#3c8044"/><rect x="1" y="4" width="4" height="1" fill="#4c9a52"/>
      <rect x="1" y="5" width="4" height="3" fill="#8a5a3a"/><rect x="1" y="5" width="4" height="1" fill="#6e4529"/>
    </g>
    <!-- seen from behind, sitting: arms are separate so they can type -->
    <g id="back-head">
      <rect x="2" y="0" width="4" height="1"/><rect x="1" y="1" width="6" height="4"/>
    </g>
    <g id="bubble">
      <rect x="0" y="0" width="9" height="6" fill="#ffffff"/><rect x="1" y="6" width="2" height="1" fill="#ffffff"/>
      <rect x="0" y="0" width="9" height="1" fill="#d9d9d2"/>
    </g>
  </defs>

  <!-- building -->
  <rect width="200" height="100" fill="#474b68"/>
  <rect x="4" y="4" width="120" height="8" fill="#e9e3d3"/><rect x="4" y="11" width="120" height="1" fill="#cfc6ad"/>
  <rect x="4" y="12" width="120" height="60" fill="url(#tiles)"/>
