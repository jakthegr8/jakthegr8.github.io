  <!-- the agent who walks to the meeting room and back -->
  <g class="walker">
    <rect x="2" y="0" width="4" height="1" fill="#2a1d14"/><rect x="1" y="1" width="6" height="2" fill="#2a1d14"/>
    <rect x="1" y="3" width="6" height="3" fill="#f1c27d"/><rect x="2" y="4" width="1" height="1" fill="#1b1b1b"/><rect x="5" y="4" width="1" height="1" fill="#1b1b1b"/>
    <rect x="1" y="6" width="6" height="3" fill="#2e8b57"/><rect x="0" y="6" width="1" height="3" fill="#256f46"/><rect x="7" y="6" width="1" height="3" fill="#256f46"/>
