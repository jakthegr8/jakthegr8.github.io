    <rect x="1" y="2" width="6" height="2" fill="#a0662f"/><rect x="6" y="0" width="3" height="3" fill="#a0662f"/><rect x="6" y="0" width="1" height="2" fill="#6e4520"/>
    <rect x="8" y="1" width="1" height="1" fill="#1b1b1b"/><rect x="9" y="2" width="1" height="1" fill="#1b1b1b"/>
